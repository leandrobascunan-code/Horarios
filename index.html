<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Horarios 2026 - Colegio Marina de Chile</title>
<meta name="description" content="Horarios por curso, electivos, docentes y equipo PIE, y cobertura de permisos administrativos.">
<meta name="theme-color" content="#0c2d5a">
<link rel="manifest" href="manifest.webmanifest?v=5">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=5">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=5">
<link rel="shortcut icon" href="favicon.ico?v=5">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Horarios">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0c2d5a; --navy-2:#123f7a; --ocean:#1477c2; --sky:#46bfe6; --gold:#e3a72a; --gold-2:#f6cf62;
  --ink:#10243f; --ink-2:#52667f; --mist:#eef3f9; --paper:#fff; --line:#d3dde9; --line-2:#e6edf5;
  --sig:#c4372c; --sig-t:#fce9e6;
  --pie:#0a7d8c; --pie-t:#d9f1f4;
  --warn:#8a5a00; --warn-t:#fdf1d3;
  --wa:#1fa855;
  --fh:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --fb:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --sh:0 1px 2px rgba(12,45,90,.07),0 10px 28px rgba(12,45,90,.07);
  --len:#d2473b; --len-t:#fae9e7;
  --mat:#2f72c4; --mat-t:#e6eef8;
  --geo:#0e8fb3; --geo-t:#e2f2f6;
  --his:#b48514; --his-t:#f6f0e3;
  --ciu:#8b5a2b; --ciu-t:#f1ebe6;
  --cie:#3f9a52; --cie-t:#e8f3ea;
  --bio:#12a37f; --bio-t:#e3f4f0;
  --qui:#7cb518; --qui-t:#eff6e3;
  --fis:#4b5bd6; --fis-t:#e9ebfa;
  --ing:#7b57c0; --ing-t:#efebf7;
  --edf:#df7a1f; --edf-t:#fbefe4;
  --art:#c04a8a; --art-t:#f7e9f1;
  --mus:#a63fb8; --mus-t:#f4e8f6;
  --tec:#546e7a; --tec-t:#eaeeef;
  --ori:#d6336c; --ori-t:#fae7ed;
  --rel:#b0707a; --rel-t:#f6eeef;
  --par:#f08a5d; --par-t:#fdf1ec;
  --ele:#2b4fa3; --ele-t:#e6eaf4;
  --otr:#64798d; --otr-t:#eceff1;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--mist);color:var(--ink);font:400 15px/1.5 var(--fb)}
h1,h2,h3,h4{font-family:var(--fh);margin:0;letter-spacing:-.015em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ocean);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.15em}

/* ---------- barra superior ---------- */
.top{background:linear-gradient(115deg,var(--navy) 0%,var(--navy-2) 55%,var(--ocean) 100%);color:#fff;position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top);box-shadow:0 6px 20px rgba(12,45,90,.25)}
.top::after{content:"";display:block;height:3px;background:linear-gradient(90deg,var(--gold),var(--gold-2) 40%,transparent)}
.top-in{max-width:1500px;margin:0 auto;padding:10px 18px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;text-decoration:none;color:inherit}
.brand img{width:46px;height:46px;border-radius:11px;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.brand h1{font-size:20px;font-weight:800;line-height:1.1}
.brand p{margin:1px 0 0;font-size:12.5px;color:#c6dcf2}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{display:inline-block;padding:8px 14px;border-radius:999px;color:#e4effa;text-decoration:none;font-weight:600;font-size:14.5px}
.tab:hover{background:rgba(255,255,255,.14)}
.tab[aria-current="page"]{background:#fff;color:var(--navy)}
.tab.cta{background:var(--gold);color:#241800}
.tab.cta:hover{background:var(--gold-2)}
.tab.cta[aria-current="page"]{background:#fff;color:#7a5400;box-shadow:0 0 0 2px var(--gold) inset}

/* ---------- estructura ---------- */
.layout{max-width:1500px;margin:0 auto;padding:20px 18px 40px;display:grid;grid-template-columns:300px minmax(0,1fr);gap:22px;align-items:start}
.layout.one{grid-template-columns:minmax(0,1fr)}
.rail{background:var(--paper);border-radius:18px;padding:16px;position:sticky;top:84px;max-height:calc(100vh - 100px);overflow:auto;box-shadow:var(--sh)}
.rail-toggle{display:none}
.stage{min-width:0}
.panel{background:var(--paper);border-radius:18px;padding:18px;box-shadow:var(--sh)}
.panel+.panel{margin-top:14px}

/* ---------- selector de cursos ---------- */
.ciclo h3{font-size:12.5px;font-weight:700;color:var(--ink-2);margin:16px 0 6px;text-transform:none;letter-spacing:0}
.ciclo:first-child h3{margin-top:0}
.nivel{display:flex;align-items:center;gap:10px;padding:3px 0}
.nivel-name{flex:1;font-weight:600}
.chips{display:flex;gap:6px}
.chip{min-width:40px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:700}
.chip:hover{border-color:var(--ocean);color:var(--ocean)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}

/* ---------- listas de personas ---------- */
.search{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;font:inherit;background:var(--mist)}
.search:focus{background:#fff}
.filters{display:flex;gap:8px;margin:8px 0 10px}
.filters select{width:100%;padding:9px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.lhead{font-size:12.5px;font-weight:700;color:var(--ink-2);margin:14px 4px 4px}
.lhead:first-child{margin-top:4px}
.pbtn{width:100%;text-align:left;background:none;border:0;border-radius:12px;padding:8px 11px;display:block}
.pbtn:hover{background:var(--mist)}
.pbtn[aria-current="true"]{background:var(--navy);color:#fff}
.pbtn b{display:block;font-weight:700}
.pbtn small{display:block;font-size:12.5px;color:var(--ink-2)}
.pbtn[aria-current="true"] small{color:#c4d8ee}
.empty-list{padding:10px;color:var(--ink-2)}

/* ---------- cabecera de cada vista ---------- */
.stage-head{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.stage-head .grow{flex:1;min-width:230px}
.kicker{font-size:13px;font-weight:700;color:var(--ocean);margin:0 0 2px}
.stage-head h2{font-size:34px;line-height:1.06;font-weight:800;color:var(--navy)}
.stage-head .meta{margin:6px 0 0;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:2px 18px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:9px 15px;border-radius:12px;border:1.5px solid var(--navy);background:#fff;font-weight:700;display:inline-flex;gap:7px;align-items:center}
.btn:hover{background:var(--navy);color:#fff}
.btn.sig{background:var(--sig);border-color:var(--sig);color:#fff}
.btn.sig:hover{background:#a02a21}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.wa:hover{background:#17863f}
.btn.ghost{border-color:var(--line)}
.btn.danger{border-color:var(--sig);color:var(--sig)}
.btn.danger:hover{background:var(--sig);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.lnk{background:none;border:0;padding:0;color:inherit;text-decoration:underline;text-decoration-color:rgba(16,36,63,.25);text-underline-offset:3px;font-weight:inherit}
.lnk:hover{text-decoration-color:currentColor}

/* ---------- grilla horaria ---------- */
.day-pills{display:none;gap:6px;margin:0 0 12px}
.day-pills button{flex:1;padding:10px 0;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:700}
.day-pills button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.sched-wrap{overflow-x:auto;background:var(--paper);border-radius:18px;padding:10px 12px 14px;box-shadow:var(--sh)}
.sched{border-collapse:separate;border-spacing:6px;width:100%;table-layout:fixed;min-width:820px}
.sched th{font:800 14px/1.2 var(--fh);text-align:left;padding:8px 10px;color:var(--navy);background:var(--mist);border-radius:10px}
.sched th.hoy{background:var(--navy);color:#fff}
.sched td{vertical-align:top;padding:0}
.sched .tcol{width:78px}
.tl{padding:6px 4px;font-variant-numeric:tabular-nums;font-size:12.5px;line-height:1.25}
.tl b{display:block;font-size:15px;color:var(--navy)}
.tl span{color:var(--ink-2)}
.gap td{padding:0}
.gap-in{font-size:12px;color:var(--ink-2);text-align:center;padding:1px 0;background:repeating-linear-gradient(90deg,var(--line-2) 0 6px,transparent 6px 12px) center/100% 1px no-repeat}
.gap-in span{background:var(--paper);padding:0 10px}
.gap-narrow{display:none}
.cell{border-radius:11px;padding:8px 10px 8px 13px;min-height:64px;display:flex;flex-direction:column;gap:3px;height:100%;position:relative;background:var(--tt);overflow:hidden}
.cell::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--st)}
.cell + .cell{margin-top:6px}
.cell .tag{font-size:12px;color:var(--ink-2);font-weight:500}
.cell .as{font-weight:700;line-height:1.25}
.cell .who{font-size:13px;color:#2c4258}
.cell .who .lnk{text-decoration-color:rgba(16,36,63,.2)}
.cell.vacio{background:transparent;border:1px dashed var(--line-2);min-height:64px}
.cell.vacio::before{display:none}
.s-len{--st:var(--len);--tt:var(--len-t)} .s-mat{--st:var(--mat);--tt:var(--mat-t)} .s-geo{--st:var(--geo);--tt:var(--geo-t)} .s-his{--st:var(--his);--tt:var(--his-t)} .s-ciu{--st:var(--ciu);--tt:var(--ciu-t)} .s-cie{--st:var(--cie);--tt:var(--cie-t)} .s-bio{--st:var(--bio);--tt:var(--bio-t)} .s-qui{--st:var(--qui);--tt:var(--qui-t)} .s-fis{--st:var(--fis);--tt:var(--fis-t)} .s-ing{--st:var(--ing);--tt:var(--ing-t)} .s-edf{--st:var(--edf);--tt:var(--edf-t)} .s-art{--st:var(--art);--tt:var(--art-t)} .s-mus{--st:var(--mus);--tt:var(--mus-t)} .s-tec{--st:var(--tec);--tt:var(--tec-t)} .s-ori{--st:var(--ori);--tt:var(--ori-t)} .s-rel{--st:var(--rel);--tt:var(--rel-t)} .s-par{--st:var(--par);--tt:var(--par-t)} .s-ele{--st:var(--ele);--tt:var(--ele-t)} .s-otr{--st:var(--otr);--tt:var(--otr-t)}

/* electivos dentro de la grilla */
.cell.el{padding-bottom:6px}
.opts{display:flex;flex-direction:column;gap:3px;margin-top:2px}
.opt{display:block;width:100%;text-align:left;border:0;background:rgba(255,255,255,.75);border-radius:7px;padding:3px 7px;font-size:12.5px;line-height:1.3}
.opt:hover{background:#fff;box-shadow:0 0 0 1.5px var(--ele) inset}
.opt b{font-weight:700}
.opt small{color:var(--ink-2);font-size:12px}
.opt .pn{color:#064f5d;font-size:11.5px;font-weight:600}

/* ---------- apoyo PIE ---------- */
.pies{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.pie-chip{display:inline-flex;align-items:center;gap:5px;background:var(--pie-t);color:#064f5d;border:1px solid var(--pie);border-radius:999px;padding:1px 9px 1px 7px;font-size:12.5px;font-weight:600;line-height:1.5}
.pie-chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--pie);flex:none}
.pie-chip.ar{border-style:dashed}
.pie-chip em{font-style:normal;font-weight:800;font-size:11px;background:#fff;border-radius:4px;padding:0 4px}
.pie-chip.btnlike{cursor:pointer}
.pie-chip.btnlike:hover{background:#bfe6ec}
.pie-chip.nodata{background:transparent;border-color:var(--line);border-style:dashed;color:var(--ink-2)}
.pie-chip.nodata::before{background:var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;color:var(--ink-2);font-size:13.5px;align-items:center}
.legend span.i{display:inline-flex;gap:6px;align-items:center}

/* ---------- calendario de profesionales ---------- */
.cal-wrap{background:var(--paper);border-radius:18px;padding:12px;box-shadow:var(--sh);overflow-x:auto}
.cal{display:grid;grid-template-columns:52px repeat(5,minmax(150px,1fr));gap:0 6px;min-width:860px}
.cal-h{font:800 14px var(--fh);color:var(--navy);background:var(--mist);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.cal-h.hoy{background:var(--navy);color:#fff}
.cal-axis{position:relative}
.cal-axis span{position:absolute;right:6px;font-size:11.5px;color:var(--ink-2);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.cal-col{position:relative;border-radius:10px;background:repeating-linear-gradient(0deg,transparent 0 calc(var(--hh) - 1px),var(--line-2) calc(var(--hh) - 1px) var(--hh))}
.ev{position:absolute;border-radius:9px;padding:4px 8px 4px 11px;overflow:hidden;font-size:12.5px;line-height:1.28;background:var(--tt);box-shadow:0 0 0 1px rgba(16,36,63,.05)}
.ev::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--st)}
.ev b{display:block;font-weight:700;font-size:13px}
.ev small{display:block;color:var(--ink-2);font-size:11.5px}
.ev.k-ac{--st:var(--mat);--tt:var(--mat-t)}
.ev.k-ar{--st:var(--pie);--tt:var(--pie-t)}
.ev.k-taller,.ev.k-priorizados{--st:var(--ing);--tt:var(--ing-t)}
.ev.k-colab{--st:#3f9a52;--tt:#e3f4e6}
.ev.k-colabpie{--st:#00a8d6;--tt:#dff4fb}
.ev.k-colabpie .ic{color:#0089b0}
.ev.k-colacion{--st:#df7a1f;--tt:#fdecdc}
.ev.k-prep{--st:#b48514;--tt:#faf1d6}
.ev.k-reunion{--st:#c04a8a;--tt:#fae6f0}
.ev.k-nolectivo{--st:#8a97a6;--tt:#eef1f5}
.ev.k-traslado{--st:#64798d;--tt:#e9eff4}
.ev.k-otro{--st:#9aabbb;--tt:#f1f4f8}
.ev .pies{margin-top:2px}
.ev small.grp{margin-top:2px;font-weight:700;color:#064f5d}
.ev .pie-chip{font-size:11px;padding:0 7px 0 6px}
.otras-nota{margin-top:10px}
.ev.k-soft{--st:#9aabbb;--tt:#f1f4f8;color:var(--ink-2)}
.ev .lnk{font-weight:700}
.kleg{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px;font-size:13.5px;color:var(--ink-2)}
.kleg i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}

/* ---------- permisos ---------- */
.form-row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.field label{display:block;font-weight:700;margin-bottom:4px}
.field input{padding:10px 11px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff}
.note{margin:12px 0 0;color:var(--ink-2);font-size:13.5px;max-width:78ch}
.day-block{margin-top:22px}
.day-block h3{font-size:21px;font-weight:800;color:var(--navy)}
.day-sum{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
.pill{padding:3px 11px;border-radius:999px;font-weight:700;font-size:13.5px;background:#fff;border:1px solid var(--line)}
.pill.ok{background:var(--pie-t);border-color:var(--pie);color:#064f5d}
.pill.bad{background:var(--sig-t);border-color:var(--sig);color:#8f251c}
.pill.warn{background:var(--warn-t);border-color:#d6a633;color:var(--warn)}
.cov{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.cov-row{display:grid;grid-template-columns:28px 134px minmax(0,1fr) minmax(0,1.25fr);gap:6px 14px;align-items:start;background:var(--paper);border-left:6px solid var(--pie);border-radius:14px;padding:12px 14px;box-shadow:var(--sh)}
.cov-row.none{border-left-color:var(--sig)}
.cov-row.none .cov-who{color:#8f251c}
.cov-row.off{opacity:.45}
.cov-row .time{font-family:var(--fh);font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;line-height:1.25;color:var(--navy)}
.cov-row .what b{display:block}
.cov-row .what small{color:var(--ink-2);font-size:13px}
.cov-who{display:flex;flex-direction:column;gap:6px}
.cov-who .hint{font-size:13px;color:var(--ink-2)}
.cov-who .alert{font-size:13px;color:var(--warn);font-weight:600}
.cov-who .bad{font-weight:700}
.cov-check{width:20px;height:20px;margin-top:3px;accent-color:var(--navy)}
.resumen{margin-top:14px}
.resumen h4{margin:0 0 6px;font:800 16px var(--fh)}
.resumen ul{margin:0;padding-left:18px}
.resumen li{margin:2px 0}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;z-index:60;box-shadow:var(--sh)}
.vacio-msg{padding:30px 22px}
.vacio-msg h2{font-size:24px;margin-bottom:8px;color:var(--navy)}
.vacio-msg p{margin:0 0 6px;max-width:64ch;color:var(--ink-2)}
.foot{max-width:1500px;margin:0 auto;padding:0 18px 30px;color:var(--ink-2);font-size:12.5px}
.opcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:6px}
.opcard{background:var(--ele-t);border-radius:12px;padding:10px 12px;text-align:left;border:0;width:100%}
.opcard:hover{box-shadow:0 0 0 2px var(--ele) inset}
.opcard b{display:block}
.opcard small{color:var(--ink-2)}
.tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag-c{padding:3px 10px;border-radius:999px;background:var(--ele-t);color:var(--ele);font-weight:700;font-size:13px;border:0}
button.tag-c:hover{box-shadow:0 0 0 1.5px var(--ele) inset}

/* ---------- configuración ---------- */
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.subnav button{padding:9px 15px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:700}
.subnav button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.banner{max-width:1500px;margin:10px auto 0;padding:10px 14px;border-radius:12px;background:var(--warn-t);border:1px solid #d6a633;color:var(--warn);font-weight:600}
.gate{max-width:420px}
.gate h2{font-size:24px;margin-bottom:6px}
.gate p{margin:0 0 12px;color:var(--ink-2)}
.fld{display:block;margin:0 0 12px}
.fld>span{display:block;font-weight:700;margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff}
.fld textarea{min-height:240px;font:13px/1.4 ui-monospace,Consolas,monospace;white-space:pre}
.err{color:#8f251c;font-weight:700;margin:8px 0 0}
.cfg-bar{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.cfg-bar .fld{margin:0;min-width:200px}
.cfg-split{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.cfg-list{max-height:70vh;overflow:auto;margin-top:8px}
.seg{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.seg button{flex:1;padding:8px 6px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.sep{border:0;border-top:1px solid var(--line-2);margin:18px 0}
.panel h3{font-size:18px;margin:0 0 8px;font-weight:800}
.panel .help{margin:0 0 10px;color:var(--ink-2);font-size:13.5px;max-width:74ch}
.confirm{background:var(--sig-t);border:1px solid var(--sig);border-radius:12px;padding:10px 12px;margin-top:10px}
.confirm p{margin:0 0 8px}
button.cell{border:0;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
button.cell:hover{box-shadow:0 0 0 2px var(--navy) inset}
button.cell.vacio{border:1px dashed var(--line);align-items:center;justify-content:center;color:var(--ink-2);font-size:13px}
button.cell.vacio:hover{box-shadow:none;border-color:var(--navy);color:var(--navy)}
.cell .mini{font-size:12.5px;color:var(--ink-2)}
.horas{width:100%;border-collapse:collapse}
.horas td,.horas th{padding:4px 8px 4px 0;text-align:left}
.horas input,.slotrow input,.slotrow select{padding:7px 8px;border:1px solid var(--line);border-radius:10px;font:inherit}
details.det{margin-top:16px}
details.det>summary{cursor:pointer;font-weight:700;padding:6px 0}
.savebar{position:sticky;bottom:0;z-index:30;background:var(--navy);color:#fff;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:11px 18px;box-shadow:0 -6px 18px rgba(12,45,90,.3)}
.savebar span{margin-right:auto;font-weight:600}
.savebar .btn{border-color:#fff}
.savebar .btn.sig{border-color:var(--sig)}
.savebar .btn.ghost{background:transparent;color:#fff;border-color:#8fa6ba}
.savebar .btn.ghost:hover{background:#fff;color:var(--navy)}
dialog{border:0;border-radius:18px;padding:0;width:min(580px,calc(100vw - 24px));max-height:calc(100vh - 24px);color:var(--ink);font:400 15px/1.5 var(--fb);box-shadow:0 24px 60px rgba(12,45,90,.4)}
dialog.wide{width:min(760px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(12,45,90,.6)}
.dlg-in{padding:20px}
.dlg-in h2{font-size:22px;line-height:1.15;color:var(--navy)}
.dlg-in .sub{margin:2px 0 14px;color:var(--ink-2)}
.sel-list{list-style:none;margin:0 0 8px;padding:0;display:flex;flex-direction:column;gap:4px}
.sel-list li{display:flex;gap:8px;align-items:center;background:var(--mist);border-radius:10px;padding:5px 9px}
.sel-list li span{flex:1}
.sel-list label{display:inline-flex;gap:4px;align-items:center;font-size:13px}
.sel-list button{border:0;background:none;font-size:18px;line-height:1;padding:2px 6px;border-radius:6px}
.sel-list button:hover{background:#fff}
.dlg-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;position:sticky;bottom:0;background:#fff;padding-top:8px}
.chk{display:flex;gap:8px;align-items:center;margin:6px 0}
.slotrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 6px}
.cks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:2px 10px;margin-bottom:10px}
.preview{max-height:46vh;overflow:auto;border:1px solid var(--line-2);border-radius:12px;padding:8px 12px;margin:10px 0;background:var(--mist)}
.preview ul{margin:4px 0 0;padding-left:18px}
.preview li{margin:2px 0;font-size:13.5px}
.preview .mapn{display:flex;gap:8px;align-items:center;margin:4px 0;flex-wrap:wrap}
.preview .mapn select{padding:5px 8px;border-radius:8px;border:1px solid var(--line);font:inherit}
.share-img{display:block;max-width:100%;max-height:62vh;margin:0 auto;border-radius:10px;box-shadow:var(--sh)}
@media (max-width:900px){.cfg-split{grid-template-columns:1fr}.cfg-list{max-height:40vh}}

/* ---------- adaptable ---------- */
@media (max-width:900px){
  .layout{grid-template-columns:1fr;padding-top:14px}
  .rail{position:static;max-height:none}
  .rail-toggle{display:flex;width:100%;justify-content:space-between;align-items:center;background:none;border:0;padding:2px;font-weight:700}
  .rail-body{display:none;margin-top:10px}
  .rail.open .rail-body{display:block}
  .rail.open .plist{max-height:50vh;overflow:auto}
  .tabs{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:2px;scrollbar-width:none}
  .tab{white-space:nowrap}
}
@media (max-width:760px){
  .stage-head h2{font-size:26px}
  .day-pills{display:flex}
  .sched{min-width:0}
  .sched [data-d]{display:none}
  .sched[data-dia="Lu"] [data-d="Lu"],.sched[data-dia="Ma"] [data-d="Ma"],.sched[data-dia="Mi"] [data-d="Mi"],
  .sched[data-dia="Ju"] [data-d="Ju"],.sched[data-dia="Vi"] [data-d="Vi"]{display:table-cell}
  .sched .tcol{width:66px}
  .gap-wide{display:none}
  .gap-narrow{display:table-cell}
  .cov-row{grid-template-columns:28px minmax(0,1fr)}
  .cov-row .time,.cov-row .what,.cov-who{grid-column:2}
  .cal{grid-template-columns:48px minmax(0,1fr);min-width:0}
  .cal [data-d]{display:none}
  .cal[data-dia="Lu"] [data-d="Lu"],.cal[data-dia="Ma"] [data-d="Ma"],.cal[data-dia="Mi"] [data-d="Mi"],.cal[data-dia="Ju"] [data-d="Ju"],.cal[data-dia="Vi"] [data-d="Vi"]{display:block}
  .top-in{padding:8px 14px}
  .brand img{width:40px;height:40px}
}
@page{size:A4;margin:8mm}
@media print{
  .top,.rail,.tools,.day-pills,.btn,.btns,.foot,.toast,.savebar,.banner{display:none!important}
  body{background:#fff}
  .layout{display:block;padding:0}
  .sched [data-d]{display:table-cell!important}
  .cal [data-d]{display:block!important}
  .cal{grid-template-columns:52px repeat(5,1fr)!important}
  .gap-wide{display:table-cell!important}
  .gap-narrow{display:none!important}
  .sched,.cal{min-width:0}
  .cell,.ev{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sched-wrap,.panel,.cal-wrap{box-shadow:none}
}

.sched td{height:1px}.sched td.span>.cell{min-height:100%}

.ev small.pietxt{color:#064f5d;font-weight:600}

.lote{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:10px}

.cal-h{display:flex;flex-direction:column;gap:1px}

function subjKey(a){
  const k=norm(a);
  if(/^electivo|^e[1-4]\b/.test(k)) return 'ele';
  if(/taller\/religion|religion/.test(k)) return 'rel';
  if(/^ed\.? ?fisica|corporalidad|movimiento|motricidad/.test(k)) return 'edf';
  if(/ingles/.test(k)) return 'ing';
  if(/lenguaje (verbal)?$|^lenguaje verbal|lectura|literatura|^lenguaje/.test(k)&&!/artistic/.test(k)) return 'len';
  if(/pensamiento mat|^matem/.test(k)) return 'mat';
  if(/geometr|stem|probab|limites/.test(k)) return 'geo';
  if(/ciudadan|filosof|conv\./.test(k)) return 'ciu';
  if(/historia|sociocultural/.test(k)) return 'his';
  if(/biolog/.test(k)) return 'bio';
  if(/quimica/.test(k)) return 'qui';
  if(/^fisica/.test(k)) return 'fis';
  if(/natural|ciencias|cs\./.test(k)) return 'cie';
  if(/musica/.test(k)) return 'mus';
  if(/arte|visual|artistic/.test(k)) return 'art';
  if(/tecnolog/.test(k)) return 'tec';
  if(/orientacion|desarollo personal|desarrollo personal|identidad|autonomia/.test(k)) return 'ori';
  if(/juego|desayuno|almuerzo|habitos|rutina/.test(k)) return 'par';
  return 'otr';
}

  D.ausencias=(D.ausencias||[]).filter(a=>a.hasta>=hoyISO()); /* licencias y permisos terminados desaparecen solos */

  TS={}; PS={}; jefaturas={};
  const cicloDe={}; D.estructura.forEach(e=>e.niveles.forEach(n=>n.cursos.forEach(c=>cicloDe[c]=e.ciclo)));
  const cd={}, cp={};
  Object.keys(D.cursos).forEach(cid=>{
    const c=D.cursos[cid];
    c.blocks.forEach(b=>DIAS.forEach(dia=>{
      const e=b.c[dia]; if(!e) return;

      e.p.forEach(p=>{(PS[p.id]=PS[p.id]||emptyWeek())[dia].push(Object.assign({},base,{docs:e.d,ar:p.ar}));(cp[p.id]=cp[p.id]||new Set()).add(cicloDe[cid]);});
    }));
    if(c.jefe)(jefaturas[c.jefe]=jefaturas[c.jefe]||[]).push(cid);
  });
  D.electivos.forEach(g=>{
    const cid='EL:'+g.id;
    g.slots.forEach(s=>{
      const base={cid,el:g.id,n:null,ini:s.ini,fin:s.fin,a:'Electivo '+g.e,det:g.nombre,nota:null,cursos:g.cursos,sala:s.sala||g.sala||null};

      s.p.forEach(p=>{(PS[p.id]=PS[p.id]||emptyWeek())[s.d].push(Object.assign({},base,{docs:g.d,ar:p.ar}));g.cursos.forEach(c=>(cp[p.id]=cp[p.id]||new Set()).add(cicloDe[c]));});
    });
  });
  const orden=D.estructura.map(e=>e.ciclo);
  D.docentes.forEach(p=>p.ciclos=orden.filter(c=>cd[p.id]&&cd[p.id].has(c)));
  D.pie.forEach(p=>{
    const s=new Set(cp[p.id]||[]);
    (p.horario||[]).forEach(h=>(h.cs||[]).forEach(c=>{if(cicloDe[c])s.add(cicloDe[c]);}));
    p.ciclos=orden.filter(c=>s.has(c));
    p.tipo=p.tipo||'docente';
  });
}

function filasTabla(fl){
  const skip=fl.map(()=>({})), rows=[];

      if(skip[r][d]) return '';
      const c=f.cells[d]; if(!c) return '<td data-d="'+d+'"><div class="cell vacio"></div></td>';
      let n=1; while(fl[r+n]&&!fl[r+n].gap&&fl[r+n].cells[d]&&fl[r+n].cells[d].sig===c.sig){ skip[r+n][d]=1; n++; }

    }).join('')+'</tr>');

    fl.push({ini:b.ini,fin:b.fin,cells});

  const hayCambio=c.blocks.some(b=>DIAS.some(d=>b.c[d]&&b.c[d].nota==='cambio'));

  return '<div class="stage-head"><div class="grow"><p class="kicker">'+esc(corto(cicloDeCurso(c.id)))+'</p><h2>'+esc(cname(c.id))+'</h2><p class="meta">'+

function eventosPersona(p,tp){

const PRIO_EV={AC:0,AR:0,priorizados:1,taller:1,colacion:2,reunion:3,colab:4,colabpie:4,traslado:5,prep:6,otro:7,nolectivo:8};
function ordenarOtras(clases,otras){
  const res=[];
  DIAS.forEach(d=>{
    const ocupado=clases.filter(c=>c.d===d).map(c=>[mins(c.ini),mins(c.fin),-1]);
    const lista=otras.filter(e=>e.d===d).slice().sort((a,b)=>(PRIO_EV[a.t]??9)-(PRIO_EV[b.t]??9)||mins(a.ini)-mins(b.ini));
    lista.forEach(e=>{
      const pr=PRIO_EV[e.t]??9;
      let tramos=[[mins(e.ini),mins(e.fin)]];
      ocupado.forEach(o=>{
        if(!(o[2]<pr||(o[2]===pr&&pr>0))) return;
        const n=[]; tramos.forEach(t=>{ if(o[1]<=t[0]||o[0]>=t[1]){n.push(t);return;} if(t[0]<o[0]) n.push([t[0],o[0]]); if(o[1]<t[1]) n.push([o[1],t[1]]); }); tramos=n;
      });
      tramos.filter(t=>t[1]-t[0]>=15).forEach(t=>{ ocupado.push([t[0],t[1],pr]); res.push(Object.assign({},e,{ini:hhmm(t[0]),fin:hhmm(t[1])})); });
    });
  });
  return res.sort((a,b)=>DIAS.indexOf(a.d)-DIAS.indexOf(b.d)||mins(a.ini)-mins(b.ini));
}

const TIPO_SOFT={colab:1,colabpie:1,colacion:1,nolectivo:1,prep:1,reunion:1,traslado:1,otro:1};

function lanes(evs){
  const out=[]; let grupo=[], fin=0;
  const orden=evs.slice().sort((a,b)=>mins(a.ini)-mins(b.ini)||mins(a.fin)-mins(b.fin));
  const cierra=()=>{const n=Math.max(1,...grupo.map(x=>x.lane+1)); grupo.forEach(x=>{x.n=n;out.push(x);}); grupo=[];};
  const finLane=[];
  orden.forEach(e=>{
    const a=mins(e.ini), b=mins(e.fin);
    if(grupo.length&&a>=fin){cierra(); finLane.length=0;}
    let l=finLane.findIndex(f=>f<=a); if(l<0){l=finLane.length;} finLane[l]=b;
    grupo.push({e,lane:l}); fin=Math.max(fin,b);
  });
  if(grupo.length) cierra();
  return out;
}
function minutosDia(jor,evs,d){
  const j=jor[d]; if(!j) return 0; let m=mins(j.fin)-mins(j.ini);

}

function jornadaDe(p,evs){

/* Hace que ninguna tarjeta quede cortada: estira la escala vertical hasta que todo el texto cabe */
function ajustarCal(raiz){
  (raiz||document).querySelectorAll('.cal-wrap').forEach(w=>{
    const cal=w.querySelector('.cal'); if(!cal||!cal.offsetParent) return;
    let k=parseFloat(w.dataset.k)||1.3; const kmax=parseFloat(w.dataset.kmax)||8;
    w.style.setProperty('--kk',k);
    for(let it=0;it<10;it++){
      let need=k;
      w.querySelectorAll('.ev').forEach(ev=>{
        if(!ev.offsetParent) return;
        const dur=+ev.dataset.dur||1;
        if(ev.scrollHeight>ev.clientHeight+1) need=Math.max(need,(ev.scrollHeight+3)/dur);

      if(need<=k+0.004||k>=kmax) break;
      k=Math.min(kmax,need); w.style.setProperty('--kk',k);

}

function fechaLarga(d){

  return t.charAt(0).toUpperCase()+t.slice(1);

function parseISO(s){const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function diasHabiles(desde,hasta){
  const out=[]; if(!desde) return out;

  for(let i=0;i<31&&a<=b;i++){ if(a.getDay()>=1&&a.getDay()<=5) out.push(new Date(a)); a.setDate(a.getDate()+1);}

function filasCobertura(tid,dia,fecha){

  const rows=[];
  slots.forEach(s=>{

    const last=rows.slice().reverse().find(r=>r.cid===s.cid);

    if(contiguo&&mismo){ last.fin=s.fin; if(!last.asigs.includes(s.a+'|'+(s.det||''))) last.asigs.push(s.a+'|'+(s.det||'')); last.bloques++; if(isPar(s.cid)){s.pie.forEach(p=>{if(!last.pie.some(x=>x.id===p.id))last.pie.push(p);});} return; }

dlg.addEventListener('click',e=>{
  const b=e.target.closest('[data-dact]'); if(!b||!DL) return;
  const a=b.dataset.dact, id=b.dataset.id;
  if(a==='cancelar'){dlg.close();return;}
  if(a==='quitd'){DL.d=DL.d.filter(x=>x!==id);pintarDlg();}
  else if(a==='quitp'){DL.p=DL.p.filter(x=>x.id!==id);pintarDlg();}
  else if(a==='vaciar'){delete D.cursos[DL.cid].blocks[DL.bi].c[DL.dia];dlg.close();marcarSucio();render();}
  else if(a==='guardar'){
    if(!DL.a.trim()){DL.err='Escriba la asignatura.';pintarDlg();return;}
    const ent={a:DL.a.trim(),d:DL.d.slice(),p:DL.p.map(p=>({id:p.id,ar:!!p.ar}))};
    if(DL.det.trim()) ent.det=DL.det.trim();
    if(DL.cambio) ent.nota='cambio';
    if(DL.sala.trim()) ent.sala=DL.sala.trim();
    D.cursos[DL.cid].blocks[DL.bi].c[DL.dia]=ent;
    dlg.close(); marcarSucio(); render();
  }
});
dlg.addEventListener('input',e=>{
  if(!DL) return;
  if(e.target.id==='dl-a') DL.a=e.target.value;

  else if(e.target.id==='dl-sala') DL.sala=e.target.value;

dlg.addEventListener('change',e=>{
  if(!DL) return; const t=e.target;
  if(t.id==='dl-addd'&&t.value){DL.d.push(t.value);pintarDlg();}
  else if(t.id==='dl-addp'&&t.value){DL.p.push({id:t.value,ar:false});pintarDlg();}
  else if(t.id==='dl-cambio'){DL.cambio=t.checked;}
  else if(t.dataset&&t.dataset.dact==='ar'){const p=DL.p.find(x=>x.id===t.dataset.id); if(p)p.ar=t.checked;}
});

function slugG(t){return norm(t).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'electivo';}
function aplicarGrupo(){
  const f=C.eg, nombre=(f.nombre||'').trim().replace(/\s+/g,' ');
  if(!nombre){f.err='Escriba el nombre del electivo.';return false;}
  if(!f.cursos.length){f.err='Elija al menos un curso.';return false;}
  if(!f.slots.length){f.err='Agregue al menos un horario.';return false;}
  for(const s of f.slots){ if(!s.ini||!s.fin||mins(s.ini)>=mins(s.fin)){f.err='Revise las horas: el término debe ser posterior al inicio.';return false;} }
  const viejo=f.id?GR[f.id]:null;
  const bloquesDe=cid=>D.cursos[cid]?D.cursos[cid].blocks:[];
  // se parte cada horario en los bloques de 45 minutos que tengan los cursos
  const bl=[]; f.cursos.forEach(c=>bloquesDe(c).forEach(b=>bl.push(b)));
  const partes=[];
  f.slots.forEach(s=>{
    const cand=uniq(bl.filter(b=>mins(b.ini)>=mins(s.ini)&&mins(b.fin)<=mins(s.fin)).map(b=>b.ini+'|'+b.fin)).map(x=>x.split('|')).sort((a,b)=>mins(a[0])-mins(b[0]));
    if(cand.length) cand.forEach(x=>partes.push({d:s.d,ini:x[0],fin:x[1]})); else partes.push({d:s.d,ini:s.ini,fin:s.fin});
  });
  const slots=partes.map(s=>{
    let p;
    if(viejo&&!f.pTocado){const o=viejo.slots.find(x=>x.d===s.d&&x.ini===s.ini); p=o?o.p.map(q=>({id:q.id,ar:q.ar})):f.p.map(q=>({id:q.id,ar:q.ar}));}
    else p=f.p.map(q=>({id:q.id,ar:!!q.ar}));
    return {d:s.d,ini:s.ini,fin:s.fin,p};
  });
  const g={id:f.id,e:+f.e,nombre,d:f.d.slice(),cursos:f.cursos.slice(),slots};
  if((f.sala||'').trim()) g.sala=f.sala.trim();
  if(!g.id){let b='E'+g.e+'-'+slugG(nombre),id=b,i=2; while(GR[id]) id=b+'-'+(i++); g.id=id; D.electivos.push(g);}
  else {const i=D.electivos.findIndex(x=>x.id===g.id); D.electivos[i]=g;}
  // los cursos del grupo muestran la franja como celda de electivo
  g.cursos.forEach(cid=>{
    (D.cursos[cid]?D.cursos[cid].blocks:[]).forEach(b=>g.slots.forEach(s=>{
      if(b.ini===s.ini&&!b.c[s.d]) b.c[s.d]={a:'Electivo '+g.e,el:g.e,d:[],p:[]};
    }));
  });
  f.err=''; f.id=g.id; f.pTocado=false; marcarSucio(); return true;
}

function clasesDoc(id){
  const w=TS[id]||emptyWeek(), out=[];
  DIAS.forEach(d=>{
    const l=w[d].filter(x=>!x.el).sort((a,b)=>mins(a.ini)-mins(b.ini));
    l.forEach(x=>{ const u=out[out.length-1]; if(u&&u.d===d&&u.cid===x.cid&&u.a===x.a&&mins(x.ini)<=mins(u.fin)+10) u.fin=x.fin; else out.push({d,cid:x.cid,a:x.a,ini:x.ini,fin:x.fin,sala:x.sala||''}); });
  });
  return out;
}

function slug(n){
  const base=norm(n).replace(/[^a-z0-9]+/g,'.').replace(/^\.|\.$/g,'');
  const b=base.split('.').map(x=>x.charAt(0).toUpperCase()+x.slice(1)).join('.')||'Persona';
  const ids=new Set(D.docentes.map(x=>x.id).concat(D.pie.map(x=>x.id)));
  let id=b,i=2; while(ids.has(id)) id=b+'.'+(i++); return id;
}
function aplicarPersona(){
  const f=C.form, pie=esPie(), pro=C.tipo==='pro';
  const nombre=(f.nombre||'').trim().replace(/\s+/g,' ');
  if(!nombre){f.err='Escriba el nombre.';return false;}
  const lista=pie?D.pie:D.docentes;
  if(lista.some(p=>p.id!==f.id&&norm(p.nombre)===norm(nombre))){f.err='Ya existe alguien con ese nombre.';return false;}
  if(!f.id){
    const o={id:slug(nombre),nombre,ciclos:[]}; if(f.sexo) o.sexo=f.sexo; if(+f.horas>0) o.horas=Math.round(+f.horas);
    if(!pie){o.abrev=(f.abrev||'').trim()||nombre;o.dept=(f.dept||'').trim()||null;o.en_listado=true;}
    else if(pro){o.tipo='profesional';o.cargo=(f.cargo||'').trim()||'Profesional PIE';o.horario=[];}
    else o.tipo='docente';
    lista.push(o); f.id=o.id;
  }else{
    const o=lista.find(p=>p.id===f.id); o.nombre=nombre; if(f.sexo) o.sexo=f.sexo; else delete o.sexo; if(+f.horas>0){ if(o.horas!==Math.round(+f.horas)) delete o.hdet; o.horas=Math.round(+f.horas);} else {delete o.horas; delete o.hdet;}
    if(!pie){o.abrev=(f.abrev||'').trim()||nombre;o.dept=(f.dept||'').trim()||null;}
    if(pro) o.cargo=(f.cargo||'').trim()||'Profesional PIE';
  }
  f.err=''; f.nombre=nombre; f.nombre0=nombre; marcarSucio(); return true;
}
function reemplazarPersona(viejo,nuevo,quitar){
  const pie=esPie();
  const swapP=p=>{const vistos=new Set(); return p.map(x=>x.id===viejo?{id:nuevo,ar:x.ar}:x).filter(x=>!vistos.has(x.id)&&vistos.add(x.id));};
  Object.values(D.cursos).forEach(c=>{
    c.blocks.forEach(b=>Object.values(b.c).forEach(e=>{
      if(pie) e.p=swapP(e.p); else e.d=uniq(e.d.map(x=>x===viejo?nuevo:x));
    }));
    if(!pie&&c.jefe===viejo) c.jefe=nuevo;
  });
  D.electivos.forEach(g=>{ if(pie) g.slots.forEach(s=>{s.p=swapP(s.p);}); else g.d=uniq(g.d.map(x=>x===viejo?nuevo:x)); });
  if(quitar) quitarDeLista(viejo);
}
function quitarDeLista(id){
  const pie=esPie();
  Object.values(D.cursos).forEach(c=>{
    c.blocks.forEach(b=>Object.values(b.c).forEach(e=>{ if(pie) e.p=e.p.filter(p=>p.id!==id); else e.d=e.d.filter(x=>x!==id); }));
    if(!pie&&c.jefe===id) c.jefe=null;
  });
  D.electivos.forEach(g=>{ if(pie) g.slots.forEach(s=>{s.p=s.p.filter(p=>p.id!==id);}); else g.d=g.d.filter(x=>x!==id); });
  if(pie) D.pie=D.pie.filter(p=>p.id!==id); else D.docentes=D.docentes.filter(p=>p.id!==id);
}

    let mig=false;
    if(!D.pie.some(x=>x.id==='R.Retamal')){ const b=BASE.pie.find(x=>x.id==='R.Retamal'); if(b){ D.pie.push(clonar(b)); mig=true;
      Object.keys(BASE.cursos).forEach(cid=>{ const c=D.cursos[cid]; if(!c) return; BASE.cursos[cid].blocks.forEach(bb=>Object.keys(bb.c).forEach(dd=>{ const q=(bb.c[dd].p||[]).find(z=>z.id==='R.Retamal'); if(!q) return; const t=c.blocks.find(x=>x.ini===bb.ini&&x.fin===bb.fin); const e=t&&t.c[dd]; if(e&&!e.el){ e.p=e.p||[]; if(!e.p.some(z=>z.id==='R.Retamal')) e.p.push({id:'R.Retamal',ar:!!q.ar}); } })); }); } }
    BASE.electivos.filter(g=>/^E4-educacion-fisica/.test(g.id)&&!D.electivos.some(x=>x.id===g.id)).forEach(g=>{ D.electivos.push(clonar(g)); mig=true; });

/* tabla: cols = encabezados de día; filas = [{hora:[a,b], celdas:[ [item,...] x5 ]}|{recreo:'texto'}]

function bGrilla(ctx,y,dib,filas,hoyIdx){
  const x0=IMG_M, wT=92, gap=6, wD=(IMG_W-2*IMG_M-wT-gap*5)/5, pad=9;

  const hh=38;

  }
  yy+=hh+gap;
  const R=filas, N=R.length;
  // 1. fusión de clases dobles: filas contiguas con el mismo contenido en el mismo día
  const sigDe=(f,i)=>JSON.stringify(f.celdas[i].map(it=>[it.k,it.lineas.map(l=>l.t)]));
  const span=R.map(()=>[0,0,0,0,0]);
  for(let r=0;r<N;r++){
    if(!R[r].celdas) continue;
    for(let i=0;i<5;i++){
      if(span[r][i]===-1) continue;
      if(!R[r].celdas[i].length){ span[r][i]=1; continue; }
      let n=1; const sg=sigDe(R[r],i);
      while(R[r+n]&&R[r+n].celdas&&R[r+n].celdas[i].length&&sigDe(R[r+n],i)===sg){ span[r+n][i]=-1; n++; }
      span[r][i]=n;
    }
  }
  // 2. medir cada celda
  const medir=items=>{
    const med=items.map(it=>{
      let h=pad*2; const ls=[]; it.lineas.forEach(l=>{ctx.font=l.f; envolver(ctx,l.t,wD-pad*2-8).forEach(t=>{ls.push({t,f:l.f,c:l.c,y:h-pad+17}); h+=l.h||21;});});
      return {it,h:Math.max(h,60),ls};
    });
    return {med,tot:med.reduce((s,x)=>s+x.h+gap,-gap)};
  };
  const M=R.map((f,r)=>f.celdas?f.celdas.map((items,i)=>span[r][i]===-1?null:medir(items)):null);
  const H=R.map((f,r)=>{ if(!f.celdas) return 24; let h=60; M[r].forEach((m,i)=>{ if(m&&span[r][i]===1&&m.med.length) h=Math.max(h,m.tot); }); return h; });

  for(let r=0;r<N;r++){ if(!R[r].celdas) continue; M[r].forEach((m,i)=>{ if(!m||span[r][i]<2) return; const e=r+span[r][i]-1; let tot=0; for(let k=r;k<=e;k++) tot+=H[k]+(k<e?gap:0); if(m.tot>tot) H[e]+=m.tot-tot; }); }
  // 3. dibujar
  R.forEach((f,r)=>{
    if(f.recreo){
      if(dib){ctx.fillStyle='#8696a8'; ctx.font='500 15px '+FONT; ctx.textAlign='center'; ctx.fillText(f.recreo,x0+wT+gap+(IMG_W-2*IMG_M-wT-gap)/2,yy+15); ctx.textAlign='left';}
      yy+=24; BRK.push(yy); return;
    }
    if(dib){
      ctx.fillStyle='#0c2d5a'; ctx.font='800 20px '+FONT; ctx.fillText(f.hora[0],x0+4,yy+24); ctx.fillStyle='#52667f'; ctx.font='500 16px '+FONT; ctx.fillText(f.hora[1],x0+4,yy+45);
      M[r].forEach((m,i)=>{
        if(!m) return;
        const x=x0+wT+gap+i*(wD+gap);
        let alto=H[r]; for(let k=1;k<span[r][i];k++) alto+=gap+H[r+k];
        if(!m.med.length){rr(ctx,x,yy,wD,alto,11); ctx.strokeStyle='#e2e9f1'; ctx.setLineDash([5,4]); ctx.lineWidth=1.2; ctx.stroke(); ctx.setLineDash([]); return;}
        let cy=yy; const extra=(alto-m.tot)/m.med.length;
        m.med.forEach(z=>{
          const col=PAL[z.it.k]||PAL.otr; const hh2=z.h+extra;
          rr(ctx,x,cy,wD,hh2,11); ctx.fillStyle=col[1]; ctx.fill();

  });

}

function aBytes(str){const u=new Uint8Array(str.length); for(let i=0;i<str.length;i++) u[i]=str.charCodeAt(i)&255; return u;}
function hex16(t){let h='FEFF'; for(let i=0;i<t.length;i++) h+=t.charCodeAt(i).toString(16).padStart(4,'0'); return '<'+h+'>';}
function armarPDF(paginas,titulo){
  // paginas: [{jpg:Uint8Array,w,h}]
  const PW=595.28, PH=841.89, partes=[]; let largo=0; const offs=[];
  const put=d=>{const u=typeof d==='string'?aBytes(d):d; partes.push(u); largo+=u.length;};
  const obj=(n,cabeza,cuerpo)=>{offs[n]=largo; put(n+' 0 obj\n'+cabeza+'\n'); if(cuerpo){put('stream\n'); put(cuerpo); put('\nendstream\n');} put('endobj\n');};
  const N=paginas.length; put('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Kids ['+paginas.map((_,i)=>(5+i*3)+' 0 R').join(' ')+'] /Count '+N+' >>');
  obj(3,'<< /Title '+hex16(titulo)+' /Author '+hex16('Colegio Marina de Chile')+' /Creator '+hex16('Horarios Marina')+' >>');
  paginas.forEach((pg,i)=>{
    const base=5+i*3, im='Im'+i, cont='q '+PW.toFixed(2)+' 0 0 '+PH.toFixed(2)+' 0 0 cm /'+im+' Do Q';
    obj(base,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+PW+' '+PH+'] /Resources << /XObject << /'+im+' '+(base+1)+' 0 R >> >> /Contents '+(base+2)+' 0 R >>');
    obj(base+1,'<< /Type /XObject /Subtype /Image /Width '+pg.w+' /Height '+pg.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+pg.jpg.length+' >>',pg.jpg);
    obj(base+2,'<< /Length '+cont.length+' >>',aBytes(cont));
  });
  const total=5+N*3, xref=largo;
  let x='xref\n0 '+total+'\n0000000000 65535 f \n';
  for(let n=1;n<total;n++){ x+=n===4?'0000000000 65535 f \n':String(offs[n]||0).padStart(10,'0')+' 00000 n \n'; }
  put(x+'trailer\n<< /Size '+total+' /Root 1 0 R /Info 3 0 R >>\nstartxref\n'+xref+'\n%%EOF');
  return new Blob(partes,{type:'application/pdf'});
}

function leerTSV(texto){
  const filas=[]; let fila=[], cel='', q=false; const t=String(texto).replace(/\r\n?/g,'\n');
  for(let i=0;i<t.length;i++){
    const ch=t[i];
    if(q){ if(ch==='"'){ if(t[i+1]==='"'){cel+='"';i++;} else q=false; } else cel+=ch; }
    else if(ch==='"'&&cel===''){ q=true; }
    else if(ch==='\t'){ fila.push(cel); cel=''; }
    else if(ch==='\n'){ fila.push(cel); filas.push(fila); fila=[]; cel=''; }
    else cel+=ch;
  }
  fila.push(cel); filas.push(fila);
  return filas.map(f=>f.map(c=>c.replace(/\s+/g,' ').trim()));
}

function planElectivos(entradas){
  const m={};
  entradas.filter(e=>e.t==='EL').forEach(e=>{ const niv=e.niv||'34', k=e.el+'|'+niv; (m[k]=m[k]||{k,n:e.el,niv,slots:[]}).slots.push({d:e.d,ini:e.ini,fin:e.fin}); });
  return Object.keys(m).map(k=>m[k]).sort((a,b)=>a.n-b.n||a.niv.localeCompare(b.niv));
}
function cursosNivel(niv){ return D.estructura.flatMap(e=>e.niveles.flatMap(n=>n.cursos)).filter(c=>/^[34]° Medio/.test(c)&&niv.indexOf(c[0])>=0); }
function nivTxt(niv){ return niv==='3'?'3° Medio':niv==='4'?'4° Medio':'3° y 4° Medio'; }
function partirSlots(X,cursos,slots){
  const bl=[]; cursos.forEach(c=>(X.cursos[c]?X.cursos[c].blocks:[]).forEach(b=>bl.push(b)));
  const partes=[];
  slots.forEach(s=>{
    const cand=uniq(bl.filter(b=>mins(b.ini)>=mins(s.ini)&&mins(b.fin)<=mins(s.fin)).map(b=>b.ini+'|'+b.fin)).map(x=>x.split('|')).sort((a,b)=>mins(a[0])-mins(b[0]));
    if(cand.length) cand.forEach(x=>partes.push({d:s.d,ini:x[0],fin:x[1]})); else partes.push({d:s.d,ini:s.ini,fin:s.fin});
  });
  return partes;
}
function pDeHermanos(X,n,cursos,d,ini,salvo){
  for(const h of X.electivos){ if(h.e!==n||h===salvo||!h.cursos.some(c=>cursos.includes(c))) continue; const o=h.slots.find(x=>x.d===d&&x.ini===ini); if(o&&o.p.length) return o.p.map(q=>({id:q.id,ar:q.ar})); }
  return [];
}
function celdasElectivo(X,g){
  g.cursos.forEach(cid=>(X.cursos[cid]?X.cursos[cid].blocks:[]).forEach(b=>g.slots.forEach(s=>{ if(b.ini===s.ini&&!b.c[s.d]) b.c[s.d]={a:'Electivo '+g.e,el:g.e,d:[],p:[]}; })));
}
function aplicarElectivosX(X,id,plan,dec){
  plan.forEach(it=>{
    const d=dec[it.k]; if(!d||d.acc==='omitir') return;
    if(d.acc.indexOf('act:')===0||d.acc.indexOf('g:')===0){
      const g=X.electivos.find(x=>x.id===d.acc.slice(d.acc.indexOf(':')+1)); if(!g) return;
      if(!g.d.includes(id)) g.d.push(id);
      if(d.acc.indexOf('act:')===0){
        const partes=partirSlots(X,g.cursos,it.slots);
        g.slots=partes.map(s=>{const o=g.slots.find(x=>x.d===s.d&&x.ini===s.ini); return {d:s.d,ini:s.ini,fin:s.fin,p:o?o.p:pDeHermanos(X,g.e,g.cursos,s.d,s.ini,g)};});
        celdasElectivo(X,g);
      }
      return;
    }
    const cursos=it.n===4?(d.cursos||[]):cursosNivel(it.niv); if(!cursos.length) return;
    const nombre=(d.nombre||'').trim().replace(/\s+/g,' ')||('Electivo '+it.n);
    const partes=partirSlots(X,cursos,it.slots);
    const slots=partes.map(s=>({d:s.d,ini:s.ini,fin:s.fin,p:pDeHermanos(X,it.n,cursos,s.d,s.ini,null)}));
    const base='E'+it.n+'-'+slugG(nombre); let gid=base,i=2; while(X.electivos.some(x=>x.id===gid)) gid=base+'-'+(i++);
    const g={id:gid,e:it.n,nombre,d:[id],cursos,slots}; X.electivos.push(g); celdasElectivo(X,g);
  });
}

function decisionesIniciales(plan,id){

    let mejor=null,pts=-1; propios.forEach(g=>{ const sc=it.slots.filter(x=>g.slots.some(y=>y.d===x.d&&mins(y.ini)>=mins(x.ini)&&mins(y.ini)<mins(x.fin))).length; if(sc>pts){pts=sc;mejor=g;} });

/* ================== LEER ARCHIVO .XLSX (sin librerías externas) ================== */
async function leerZip(buf){
  const u8=new Uint8Array(buf), dv=new DataView(buf);
  let e=u8.length-22; while(e>=0&&dv.getUint32(e,true)!==0x06054b50) e--;
  if(e<0) throw new Error('zip');
  const n=dv.getUint16(e+10,true); let p=dv.getUint32(e+16,true); const files={};
  for(let i=0;i<n;i++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const nl=dv.getUint16(p+28,true), el=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true);
    files[new TextDecoder().decode(u8.subarray(p+46,p+46+nl))]={m:dv.getUint16(p+10,true),cs:dv.getUint32(p+20,true),lho:dv.getUint32(p+42,true)};
    p+=46+nl+el+cl;
  }
  return {names:Object.keys(files),async leer(name){
    const f=files[name]; if(!f) return null;
    const st=f.lho+30+dv.getUint16(f.lho+26,true)+dv.getUint16(f.lho+28,true), data=u8.subarray(st,st+f.cs);
    if(f.m===0) return data;
    const out=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Uint8Array(await new Response(out).arrayBuffer());
  }};
}
const xmlDe=b=>new DOMParser().parseFromString(new TextDecoder('utf-8').decode(b),'text/xml');
function colNum(ref){ const m=/^([A-Z]+)(\d+)$/.exec(ref); let c=0; for(let i=0;i<m[1].length;i++) c=c*26+m[1].charCodeAt(i)-64; return {c:c-1,r:+m[2]-1}; }
function textoSI(si){ let t=''; si.querySelectorAll('t').forEach(x=>{ if(!x.closest('rPh')) t+=x.textContent; }); return t; }
async function leerXlsx(buf){
  const z=await leerZip(buf);
  const wbB=await z.leer('xl/workbook.xml'); if(!wbB) throw new Error('xlsx');
  const wb=xmlDe(wbB), relB=await z.leer('xl/_rels/workbook.xml.rels'), rels={};
  if(relB) xmlDe(relB).querySelectorAll('Relationship').forEach(r=>{ rels[r.getAttribute('Id')]=r.getAttribute('Target'); });
  const ssB=await z.leer('xl/sharedStrings.xml'), ss=ssB?Array.from(xmlDe(ssB).querySelectorAll('si')).map(textoSI):[];
  const hojas=[], NSR='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const nodos=Array.from(wb.querySelectorAll('sheet'));
  for(const sh of nodos){
    let tg=rels[sh.getAttributeNS(NSR,'id')]||rels[sh.getAttribute('r:id')]; if(!tg) continue;
    tg=tg.replace(/^\//,''); const path=tg.indexOf('xl/')===0?tg:'xl/'+tg;
    const b=await z.leer(path); if(!b) continue;
    const doc=xmlDe(b), grid=[], merges=[]; let maxC=0;
    doc.querySelectorAll('sheetData > row > c, sheetData row c').forEach(c=>{
      const ref=c.getAttribute('r'); if(!ref) return; const pos=colNum(ref); if(pos.c>80||pos.r>2000) return;
      const t=c.getAttribute('t'), v=c.querySelector('v'); let val='';
      if(t==='s'){ val=v?(ss[+v.textContent]||''):''; }
      else if(t==='inlineStr'){ val=textoSI(c); }
      else if(v){
        val=v.textContent;
        if(!t||t==='n'){ const x=parseFloat(val); if(isFinite(x)&&x>0&&x<1){ const mm=Math.round(x*1440); val=pad(Math.floor(mm/60))+':'+pad(mm%60)+':00'; } }
        else if(t==='b') val=val==='1'?'VERDADERO':'FALSO';
      }
      (grid[pos.r]=grid[pos.r]||[])[pos.c]=String(val).replace(/\s+/g,' ').trim(); if(pos.c>maxC) maxC=pos.c;
    });
    for(let r=0;r<grid.length;r++){ const f=grid[r]||(grid[r]=[]); for(let c=0;c<=maxC;c++) if(f[c]==null) f[c]=''; }
    doc.querySelectorAll('mergeCell').forEach(m=>{ const q=(m.getAttribute('ref')||'').split(':'); if(q.length===2){ const a=colNum(q[0]), b2=colNum(q[1]); merges.push({r1:a.r,c1:a.c,r2:b2.r,c2:b2.c}); } });
    grid.merges=merges;
    hojas.push({name:sh.getAttribute('name'),grid});
  }
  if(!hojas.length) throw new Error('vacio');
  return hojas;
}

  try{
    if(!/\.xls[xm]$/i.test(file.name)){ m.err='El archivo debe ser de Excel con extensión .xlsx. Si es .xls, ábralo en Excel y use Guardar como .xlsx.'; render(); return; }
    if(typeof DecompressionStream==='undefined'){ m.err='Este navegador no puede abrir archivos Excel. Actualícelo, o copie y pegue las celdas.'; render(); return; }
    const hojas=await leerXlsx(await file.arrayBuffer());
    m.arch={nombre:file.name,hojas}; m.hoja=Math.max(0,hojas.findIndex(h=>tieneDias(h.grid))); m.pidx=0;
    leerImportado();
  }catch(err){ console.error(err); m.arch=null; m.err='No pude leer ese archivo. Compruebe que sea un .xlsx sin contraseña, o copie y pegue las celdas.'; }
  render(); const pv=document.querySelector('.preview'); if(pv) pv.scrollIntoView({block:'center'});
}
function leerImportado(){
  const m=C.imp; m.err=''; m.res=null;
  if(!m.arch&&!m.texto.trim()){m.err='Cargue el archivo de Excel o pegue primero el horario copiado.';return;}
  const g=m.arch?m.arch.hojas[m.hoja||0].grid:leerTSV(m.texto), I=indicePersonas();
  if(m.modo==='curso'){
    const paneles=leerPaneles(g,I);
    if(!paneles.length){m.err='No encontré los días Lu, Ma, Mi, Ju, Vi. Copie también la fila de los días.';return;}
    m.paneles=paneles.map((q,i)=>q.cid?cname(q.cid):'Horario '+(i+1)); if((m.pidx||0)>=paneles.length) m.pidx=0;
    const p=paneles[m.pidx||0]; const cid=m.cid||p.cid;
    if(!cid){m.err='No pude saber de qué curso es. Elija el curso en la lista.';return;}
    if(!p.filas.length){m.err='No encontré filas de horario bajo los días.';return;}
    const pr=proponerCurso(p,cid,I); pr.modo='curso'; if(paneles.length>1&&!m.arch) pr.warns.unshift('Pegó '+paneles.length+' cursos a la vez: se usó solo el primero ('+cname(cid)+'). Copie un curso por vez.'); m.res=pr;
  }else{
    const r=analizarPersona(g,I,m.pid);
    if(r.err){m.err=r.err;return;}
    if(r.tipo==='doc'){
      m.el=decisionesIniciales(r.plan,r.id);
      r.prev=o=>{const X=clonar(D); aplicarDocX(X,r.id,r.entradas,o,r.plan,m.el); return X;};
    }else r.prev=o=>{const X=clonar(D); aplicarPersonaX(X,r.tipo,r.id,r.entradas,o); return X;};
    m.res=r;
  }
}
/* lee una hoja de horario individual y dice de quién es */
function analizarPersona(g,I,pid){
  let r=leerHorarioPersona(g);
  if(!r.entradas.length) return {err:'No encontré un horario. Copie desde la fila con LUNES a VIERNES hacia abajo, incluidas las columnas de horas.'};
  let t=null;
  if(pid){const q=pid.split(':'); t={tipo:q[0],id:q[1]};}
  else (r.nombres||[]).some(nm=>{ t=resolverPersona(I,nm)||buscarPorNombre(I,nm); return !!t; });
  if(!t) return {err:'No pude saber de quién es el horario'+(r.nombre?' ("'+r.nombre+'")':'')+'. Elija a la persona en la lista.'};
  if(t.tipo==='pie'&&PIE[t.id]&&PIE[t.id].tipo==='profesional') t.tipo='pro';
  if(t.tipo==='doc') r=leerHorarioPersona(g,true);
  const warns=[]; const sinCurso=r.entradas.filter(e=>(e.t==='AC'||e.t==='AR')&&!e.cs.length).length;
  if(sinCurso) warns.push(sinCurso+' entradas no indican el curso y no se asignan a ninguno.');
  if(t.tipo!=='doc'&&r.entradas.some(e=>e.t==='EL')) warns.push('Las clases en electivos no se aplican a este tipo de persona: edítelas en la sección Electivos.');
  if(!(g.merges&&g.merges.length)) warns.push('Las celdas combinadas de Excel llegan solo en su primera fila: revise que las duraciones sean las correctas.');
  return {modo:'persona',tipo:t.tipo,id:t.id,entradas:r.entradas,plan:t.tipo==='doc'?planElectivos(r.entradas):[],warns,nombreHoja:r.nombre};
}

/* ----- varios archivos a la vez (docentes y profesionales) ----- */
const hojaDudosa=n=>/reempl|copia|combinado/i.test(n||'');
function puntajeHoja(r){
  if(r.tipo!=='doc') return 0.5;
  const w=TS[r.id]||emptyWeek(); let tot=0,sc=0;
  r.entradas.filter(e=>['AC','AR','EL'].indexOf(e.t)>=0).forEach(e=>{tot++; if((w[e.d]||[]).some(x=>Math.min(mins(x.fin),mins(e.fin))-Math.max(mins(x.ini),mins(e.ini))>=20)) sc++;});
  return tot?sc/tot:0;
}
const tokNom=t=>norm(t).split(/[^a-z]+/).filter(x=>x.length>1);
function analizarItem(it,I){
  if(!it.grids) return;
  it.hojas=it.grids.map(h=>{const r=analizarPersona(h.grid,I,it.pid); r.hoja=h.name; if(!r.err) r.pts=puntajeHoja(r)-(hojaDudosa(h.name)?0.5:0); return r;});
  if(!it.manual){ let b=-1,bs=-9; it.hojas.forEach((r,i)=>{ if(!r.err&&r.pts>bs){bs=r.pts;b=i;} }); it.sel=b<0?0:b; }
  const r=it.hojas[it.sel]; it.aviso='';
  if(r&&!r.err){
    const nom=r.tipo==='doc'?(DOC[r.id]||{}).nombre:(PIE[r.id]||{}).nombre, ft=new Set(tokNom(it.nombre.replace(/\.xlsx?$/i,'').replace(/#U([0-9a-f]{4})/gi,(_,h)=>String.fromCharCode(parseInt(h,16)))));
    const comunes=tokNom(nom||'').filter(x=>ft.has(x)).length;
    if(comunes<Math.min(2,tokNom(nom||'').length)) { it.aviso='El nombre del archivo no coincide con '+(nom||'la persona detectada')+'. Revise antes de aplicar.'; if(!it.manualInc) it.inc=false; }
    else if(hojaDudosa(r.hoja)) it.aviso='La hoja elegida parece un reemplazo o copia.';
  }
}
async function cargarLote(files){
  const m=C.imp; m.err=''; m.res=null; m.arch=null; m.lote=null;
  if(typeof DecompressionStream==='undefined'){ m.err='Este navegador no puede abrir archivos Excel. Actualícelo, o cargue de a uno.'; render(); return; }
  const I=indicePersonas(), items=[];
  for(const f of files){
    const it={nombre:f.name,inc:true,sel:0,pid:''};
    try{
      if(!/\.xls[xm]$/i.test(f.name)) throw new Error('Debe ser un archivo .xlsx.');
      const hojas=await leerXlsx(await f.arrayBuffer());
      it.grids=hojas.filter(h=>tieneDias(h.grid)).map(h=>({name:h.name,grid:h.grid}));
      if(!it.grids.length) throw new Error('No encontré los días Lunes a Viernes.');
    }catch(err){ it.err=err.message&&err.message.length<90&&!/^xlsx$|^zip$/.test(err.message)?err.message:'No pude leer este archivo.'; it.inc=false; }
    items.push(it);
  }
  items.forEach(it=>analizarItem(it,I));
  items.forEach(it=>{ const r=it.hojas&&it.hojas[it.sel]; if(!it.err&&(!r||r.err)){ it.inc=false; } });
  m.lote={items,opts:{limpia:false,reemplaza:false}};
  render();
}
function decLote(r){

  return {dec,omit};
}
function resumenItem(it,L){
  const r=it.hojas[it.sel]; if(!r||r.err) return null;
  const k=JSON.stringify([it.sel,it.pid,L.opts]); if(it._k===k&&it._res) return it._res;
  let o;

  else{
    const X=clonar(D), dl=r.tipo==='doc'?decLote(r):{dec:{},omit:0};
    if(r.tipo==='doc') aplicarDocX(X,r.id,r.entradas,L.opts,r.plan,dl.dec); else aplicarPersonaX(X,r.tipo,r.id,r.entradas,L.opts);
    const antes=clavesPersona(D,r.tipo,r.id), despues=clavesPersona(X,r.tipo,r.id);

function crearPersonaImp(texto,rol,cache){

async function aplicarImportado(){
  const m=C.imp, r=m.res; if(!r) return;

    const c=D.cursos[r.cid], cache={};
    const resolver=cell=>{

        let tgt;
        if(acc.indexOf('new:')===0) tgt=crearPersonaImp(u.t,acc.slice(4),cache); else {const q=acc.split(':'); tgt={tipo:q[0],id:q[1]};}
        if(tgt.tipo==='doc'){ if(!cell.d.includes(tgt.id)) cell.d.push(tgt.id); } else if(!cell.p.some(x=>x.id===tgt.id)) cell.p.push({id:tgt.id,ar:u.ar});
      });

  else if(act==='pcancel'){C.form=null;repintarPersonas();}
  else if(act==='pconf'){C.confirm='del';repintarPersonas();}
  else if(act==='pconf2'){C.confirm='reset';render();}
  else if(act==='pnoconf'){C.confirm=null;render();}
  else if(act==='pdel'){const id=C.form.id,nom=C.form.nombre0||C.form.nombre;quitarDeLista(id);marcarSucio();C.form=null;C.confirm=null;render();aviso('Se quitó a '+nom);}
  else if(act==='preemplazar'){
    const dest=document.getElementById('pf-rep').value; if(!dest){aviso('Elija a quién pasa sus clases');return;}
    const quitar=document.getElementById('pf-quitar').checked; const f=C.form;
    const nomDest=(esPie()?PIE[dest]:DOC[dest]).nombre;
    reemplazarPersona(f.id,dest,quitar); marcarSucio();
    C.form=quitar?null:Object.assign({},f); render(); aviso('Sus clases pasaron a '+nomDest);
  }
  else if(act==='reset'){resetear();}
  else if(act==='prochorquitar'){const p=PIE[C.form.id]; p.horario.splice(+a.dataset.i,1); rederivarPro(p.id); marcarSucio(); repintarPersonas();}
  else if(act==='prochoragregar'){
    const p=PIE[C.form.id]; const ini=document.getElementById('pe-ini').value, fin=document.getElementById('pe-fin').value;
    if(!ini||!fin||mins(ini)>=mins(fin)){aviso('Revise las horas.',3000);return;}
    const cs=[...document.getElementById('pe-cs').selectedOptions].map(o=>o.value);
    const t=document.getElementById('pe-t').value;
    p.horario=p.horario||[]; p.horario.push({d:document.getElementById('pe-d').value,ini,fin,t,cs,a:document.getElementById('pe-a').value.trim()||null,s:document.getElementById('pe-s').value.trim()||null});
    rederivarPro(p.id); marcarSucio(); repintarPersonas(); aviso('Atención agregada');
  }
  else if(act==='dclasequitar'){
    const [cid,d,ini,fin]=a.dataset.k.split('|'), id=C.form.id;
    (D.cursos[cid]?D.cursos[cid].blocks:[]).forEach(b=>{ if(b.c[d]&&!b.c[d].el&&mins(b.ini)>=mins(ini)&&mins(b.fin)<=mins(fin)) b.c[d].d=(b.c[d].d||[]).filter(x=>x!==id); });
    marcarSucio(); repintarPersonas(); aviso('Clase quitada');
  }
  else if(act==='dclaseagregar'){
    const id=C.form.id, cid=document.getElementById('dc-c').value, d=document.getElementById('dc-d').value, ini=document.getElementById('dc-ini').value, fin=document.getElementById('dc-fin').value, asig=document.getElementById('dc-a').value.trim();
    if(!ini||!fin||mins(ini)>=mins(fin)){aviso('Revise las horas.',3000);return;}
    const bl=(D.cursos[cid]?D.cursos[cid].blocks:[]).filter(b=>Math.min(mins(b.fin),mins(fin))-Math.max(mins(b.ini),mins(ini))>=20);
    if(!bl.length){aviso('Ese curso no tiene bloques en ese horario.',3500);return;}
    let n=0, falta=false;
    bl.forEach(b=>{ const e=b.c[d]; if(e){ if(e.el) return; e.d=e.d||[]; if(!e.d.includes(id)) e.d.push(id); n++; } else if(asig){ b.c[d]={a:asig,d:[id],p:[]}; n++; } else falta=true; });
    if(!n){aviso(falta?'Esos bloques están vacíos: escriba la asignatura.':'Esos bloques son de electivo: edítelos en Electivos.',4000);return;}
    marcarSucio(); repintarPersonas(); aviso('Clase agregada ('+n+(n===1?' bloque':' bloques')+')');
  }
  else if(act==='dhorquitar'){const p=DOC[C.form.id]; p.horario.splice(+a.dataset.i,1); marcarSucio(); repintarPersonas();}
  else if(act==='dhoragregar'){
    const p=DOC[C.form.id], ini=document.getElementById('do-ini').value, fin=document.getElementById('do-fin').value;
    if(!ini||!fin||mins(ini)>=mins(fin)){aviso('Revise las horas.',3000);return;}
    const o={d:document.getElementById('do-d').value,ini,fin,t:document.getElementById('do-t').value}, det=document.getElementById('do-det').value.trim(); if(det) o.det=det;
    p.horario=p.horario||[]; p.horario.push(o); marcarSucio(); repintarPersonas(); aviso('Actividad agregada');
  }
  else if(act==='egnuevo'){C.eg=nuevoGrupoForm();C.confirm=null;repintarGrupos();}
  else if(act==='egsel'){const g=GR[a.dataset.id]; if(g){C.eg=formDeGrupo(g);C.confirm=null;repintarGrupos();}}
  else if(act==='egcancel'){C.eg=null;repintarGrupos();}
  else if(act==='egquitd'){C.eg.d=C.eg.d.filter(x=>x!==a.dataset.id);repintarGrupos();}
  else if(act==='egquitp'){C.eg.p=C.eg.p.filter(x=>x.id!==a.dataset.id);C.eg.pTocado=true;repintarGrupos();}
  else if(act==='egaddslot'){C.eg.slots.push({d:'Lu',ini:'09:45',fin:'10:30'});repintarGrupos();}
  else if(act==='egquitslot'){C.eg.slots.splice(+a.dataset.i,1);repintarGrupos();}
  else if(act==='egconf'){C.confirm='egdel';repintarGrupos();}
  else if(act==='egnoconf'){C.confirm=null;repintarGrupos();}
  else if(act==='egdel'){
    const id=C.eg.id, g=GR[id];
    D.electivos=D.electivos.filter(x=>x.id!==id);
    marcarSucio(); C.eg=null; C.confirm=null; render(); aviso('Se quitó el electivo '+(g?g.nombre:''));
  }
  else if(false){C.imp=Object.assign(nuevoImp(),{modo:a.dataset.v,texto:(C.imp&&C.imp.texto)||'',arch:(C.imp&&C.imp.arch)||null,hoja:(C.imp&&C.imp.hoja)||0}); if(C.imp.arch){ const h=C.imp.arch.hojas; if(!tieneDias(h[C.imp.hoja].grid)){ const i=h.findIndex(x=>tieneDias(x.grid)); if(i>=0) C.imp.hoja=i; } leerImportado(); } render();}
  else if(act==='impleer'){leerImportado(); render(); const p=document.querySelector('.preview'); if(p) p.scrollIntoView({block:'center'});}
  else if(act==='impborrar'){C.imp=Object.assign(nuevoImp(),{modo:C.imp.modo}); render();}
  else if(act==='impaplicar'){aplicarImportado();}
  else if(act==='lotaplicar'){aplicarLote();}
});

app.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='fc'){S.ciclo=t.value; document.getElementById('items').innerHTML=itemsPersonas(S.tab);}
  else if(t.id==='fd'||t.id==='fh'){
    if(t.id==='fd'){S.desde=t.value||S.desde; if(!S.hasta||S.hasta<S.desde) S.hasta=S.desde; document.getElementById('fh').value=S.hasta;}
    else{S.hasta=t.value||S.desde; if(S.hasta<S.desde){S.desde=S.hasta; document.getElementById('fd').value=S.desde;}}
    S.off.clear(); actualizarHash(); refrescarResultados();
  }
  else if(t.id==='inccolab'){S.inclColab=t.checked; render();}
  else if(t.dataset&&t.dataset.act==='inc'){
    if(t.checked) S.off.delete(t.dataset.k); else S.off.add(t.dataset.k);
    refrescarResultados();
  }
  else if(t.classList&&t.classList.contains('in-sala')){asignarSalaClase(t.dataset.ks,t.value);refrescarSavebar();aviso('Sala actualizada');}
  else if(t.id==='cfcurso'){C.curso=t.value;render();}
  else if(t.id==='cfjefe'){D.cursos[C.curso].jefe=t.value||null;marcarSucio();render();}
  else if(t.dataset&&t.dataset.act==='hora'){
    const b=D.cursos[C.curso].blocks[+t.dataset.b]; if(!t.value) {t.value=b[t.dataset.k];return;}
    b[t.dataset.k]=t.value; marcarSucio(); render();
    const det=document.querySelector('details.det'); if(det) det.open=true;
  }
  else if(t.id==='eg-e'&&C.eg){C.eg.e=+t.value;}
  else if(t.id==='eg-addd'&&t.value){C.eg.d.push(t.value);repintarGrupos();}
  else if(t.id==='eg-addp'&&t.value){C.eg.p.push({id:t.value,ar:false});C.eg.pTocado=true;repintarGrupos();}
  else if(t.dataset&&t.dataset.act==='egcurso'){const id=t.dataset.id; C.eg.cursos=t.checked?uniq(C.eg.cursos.concat(id)):C.eg.cursos.filter(x=>x!==id);}
  else if(t.dataset&&t.dataset.act==='egar'){const p=C.eg.p.find(x=>x.id===t.dataset.id); if(p){p.ar=t.checked;C.eg.pTocado=true;}}
  else if(t.dataset&&t.dataset.act==='egslot'){const s=C.eg.slots[+t.dataset.i]; if(s) s[t.dataset.k]=t.value;}
  else if(t.id==='imp-file'&&C.imp){ if(t.files&&t.files.length>1&&C.imp.modo==='persona') cargarLote(Array.from(t.files)); else if(t.files&&t.files[0]) cargarArchivo(t.files[0]); }
  else if(t.id==='imp-hoja'&&C.imp){C.imp.hoja=+t.value; C.imp.pidx=0; leerImportado(); render();}
  else if(t.id==='imp-panel'&&C.imp){C.imp.pidx=+t.value; leerImportado(); render();}
  else if(t.id==='imp-cid'&&C.imp){C.imp.cid=t.value;}
  else if(t.id==='imp-pid'&&C.imp){C.imp.pid=t.value;}
  else if(t.dataset&&t.dataset.act==='impmapa'){C.imp.map[t.dataset.t]=t.value;}
  else if(t.dataset&&t.dataset.act==='impel'){C.imp.el[t.dataset.k].acc=t.value; render();}
  else if(t.dataset&&t.dataset.act==='impelcurso'){const d=C.imp.el[t.dataset.k]; d.cursos=t.checked?uniq((d.cursos||[]).concat(t.dataset.id)):(d.cursos||[]).filter(x=>x!==t.dataset.id); render();}
  else if(t.dataset&&t.dataset.act==='impopt'){C.imp.opts[t.dataset.k]=t.checked; render();}
  else if(t.dataset&&t.dataset.act==='loteopt'){C.imp.lote.opts[t.dataset.k]=t.checked; render();}
  else if(t.dataset&&t.dataset.act==='loteinc'){const it=C.imp.lote.items[+t.dataset.i]; it.inc=t.checked; it.manualInc=true; render();}
  else if(t.dataset&&t.dataset.act==='lotehoja'){const it=C.imp.lote.items[+t.dataset.i]; it.sel=+t.value; it.manual=true; analizarItem(it,indicePersonas()); render();}
  else if(t.dataset&&t.dataset.act==='lotepid'){const it=C.imp.lote.items[+t.dataset.i]; it.pid=t.value; it.manual=false; if(t.value){it.inc=true;it.manualInc=true;} analizarItem(it,indicePersonas()); render();}
});
app.addEventListener('submit',e=>{
  const f=e.target.closest('form'); if(!f) return; e.preventDefault();
  if(f.dataset.form==='persona'){
    if(aplicarPersona()){ C.confirm=null; render(); aviso('Cambios aplicados'); } else repintarPersonas();
  }else if(f.dataset.form==='grupo'){
    if(aplicarGrupo()){ C.confirm=null; render(); aviso('Electivo actualizado'); } else repintarGrupos();
  }else if(f.dataset.form==='aus'){
    if(agregarAusencia()){ render(); aviso('Registro agregado'); } else render();
  }else if(f.dataset.form==='entrar'){ entrar(document.getElementById('clave').value); }
});
function refrescarSavebar(){ if(!document.querySelector('.savebar')) app.insertAdjacentHTML('beforeend',savebar()); }
function refrescarResultados(){const r=document.getElementById('resultados'); if(r){ r.innerHTML=resultadosPermiso(); ajustarCal(r);} }
async function entrar(clave){
  S.guardando=true; S.authErr=''; render();
  try{
    const j=await api({accion:'verificar',clave});
    if(j.ok){ S.auth={ok:true,clave}; guardaSS('hclave',clave); }
    else if(j.error==='clave') S.authErr='La clave no es correcta.';
    else S.authErr=(j.mensaje||('El servidor respondió con un error ('+(j.error||'desconocido')+').'));
  }catch(err){ S.authErr='No se pudo conectar con el servidor.'; }
  S.guardando=false; render();
}
async function recargar(){
  S.cargando=true; render();
  try{ await cargarServidor(); S.errCarga=''; C.form=null; C.eg=null; C.msg='Datos recargados.'; }catch(err){ S.errCarga='No se pudo conectar con el servidor.'; }
  S.cargando=false; render();
}
async function resetear(){
  C.confirm=null;
  if(API_URL){
    try{
      const j=await api({accion:'restablecer',clave:S.auth.clave});
      if(!j.ok){ aviso('No se pudo restablecer: '+(j.mensaje||j.error||'error'),5000); render(); return; }
      S.version=j.version||0;
    }catch(err){ aviso('No se pudo conectar con el servidor.',5000); render(); return; }
  }
  D=clonar(BASE); construir(); SNAP=JSON.stringify(D); S.dirty=false; C.form=null; C.eg=null; C.curso=null;
  C.msg='Se restauraron los datos originales.'; render(); aviso('Datos originales restaurados');
}
function copiar(txt){
  const ok=()=>aviso('Resumen copiado');
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(ok,()=>fallback());}
  else fallback();
  function fallback(){const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok();}catch(_){aviso('No se pudo copiar');}ta.remove();}
}
function aviso(m,ms){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(aviso.t);aviso.t=setTimeout(()=>t.hidden=true,ms||2200);}
window.addEventListener('hashchange',render);
/* al imprimir, todo el horario se ajusta a una sola hoja */
window.addEventListener('beforeprint',()=>{ const l=document.querySelector('.layout'); if(!l) return; l.style.zoom=''; const h=l.scrollHeight, w=l.scrollWidth; const z=Math.min(1,1000/(h*1.08),700/Math.max(w,1)*1.35); if(z<1) l.style.zoom=Math.max(.3,z).toFixed(3); });
window.addEventListener('afterprint',()=>{ const l=document.querySelector('.layout'); if(l) l.style.zoom=''; });
let _rz; window.addEventListener('resize',()=>{clearTimeout(_rz);_rz=setTimeout(()=>ajustarCal(),150);});
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>ajustarCal());
window.addEventListener('beforeunload',e=>{ if(S.dirty){ e.preventDefault(); e.returnValue=''; } });

/* ---------- instalación como aplicación ---------- */
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}

/* ---------- arranque ---------- */
(async function(){
  const c=leeSS('hclave');
  if(API_URL&&c) S.auth={ok:true,clave:c};
  if(API_URL){
    S.cargando=true; render();
    try{ await Promise.race([cargarServidor(),new Promise((_,rej)=>setTimeout(()=>rej(new Error('tiempo')),12000))]); }
    catch(err){ S.errCarga='No se pudo conectar con el servidor: se muestran los datos base de data.js.'; }
    S.cargando=false;
  }
  render();
})();
})();
