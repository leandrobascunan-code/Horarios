  const a=e.target.closest('[data-act]'); if(!a||a.tagName==='INPUT'||a.tagName==='SELECT') return;
  const act=a.dataset.act;
  if(act==='dia'){S.dia=a.dataset.v; document.querySelectorAll('.sched,.cal').forEach(t=>t.dataset.dia=S.dia); document.querySelectorAll('.day-pills button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S.dia));}
  else if(act==='rail'){S.railOpen=!S.railOpen; const r=document.querySelector('.rail'); r.classList.toggle('open',S.railOpen); a.setAttribute('aria-expanded',S.railOpen); a.lastChild.textContent=S.railOpen?'Cerrar lista':'Cambiar';}
  else if(act==='print'){window.print();}
  else if(act==='editdoc'){C.tipo='doc';C.q='';const p=D.docentes.find(x=>x.id===a.dataset.id);if(p){C.form={id:p.id,nombre:p.nombre,nombre0:p.nombre,abrev:p.abrev||'',dept:p.dept||'',cargo:p.cargo||'',err:''};}C.confirm=null;ir('config','personas');window.scrollTo({top:0});}
  else if(act==='compartir'){compartir(a.dataset.tipo,a.dataset.id);}
  else if(act==='pdf'){descargarPDF(a.dataset.tipo,a.dataset.id);}
  else if(act==='copiar'){copiar(textoResumen());}
  else if(act==='celda'){abrirCelda(+a.dataset.b,a.dataset.dia);}
  else if(act==='celdael'){aviso('Los electivos se editan en la sección Electivos.',3500);}
  else if(act==='guardar'){guardar();}
  else if(act==='descargar'){descargar();}
  else if(act==='descartar'){D=JSON.parse(SNAP);construir();S.dirty=false;C.form=null;C.eg=null;C.confirm=null;render();aviso('Cambios descartados');}
  else if(act==='salir'){S.auth={ok:false,clave:''};guardaSS('hclave',null);render();}
  else if(act==='recargar'){recargar();}
  else if(act==='ptipo'){C.tipo=a.dataset.v;C.form=null;C.q='';C.confirm=null;render();}
  else if(act==='pers'){const lista=C.tipo==='doc'?D.docentes:D.pie;const p=lista.find(x=>x.id===a.dataset.id);if(p){C.form={id:p.id,nombre:p.nombre,nombre0:p.nombre,abrev:p.abrev||'',dept:p.dept||'',cargo:p.cargo||'',err:''};C.confirm=null;repintarPersonas();}}
  else if(act==='pnuevo'){C.form={id:null,nombre:'',abrev:'',dept:'',cargo:'',err:''};C.confirm=null;repintarPersonas();const i=document.getElementById('pf-nombre');if(i)i.focus();}
  else if(act==='pcancel'){C.form=null;repintarPersonas();}
  else if(act==='pconf'){C.confirm='del';repintarPersonas();}
  else if(act==='pconf2'){C.confirm='reset';render();}
  else if(act==='pnoconf'){C.confirm=null;render();}
  else if(act==='pdel'){const id=C.form.id,nom=C.form.nombre0||C.form.nombre;quitarDeLista(id);marcarSucio();C.form=null;C.confirm=null;render();aviso('Se quitó a '+nom);}
  else if(act==='preemplazar'){
    const dest=document.getElementById('pf-rep').value; if(!dest){aviso('Elija a quién pasa sus clases');return;}
    const quitar=document.getElementById('pf-quitar').checked; const f=C.form;
    const nomDest=(esPie()?PIE[dest]:DOC[dest]).nombre;
    reemplazarPersona(f.id,dest,quitar); marcarSucio();
    C.form=quitar?null:Object.assign({},f); render(); aviso('Sus clases pasaron a '+nomDest);
  }
  else if(act==='reset'){resetear();}
  else if(act==='prochorquitar'){const p=PIE[C.form.id]; p.horario.splice(+a.dataset.i,1); rederivarPro(p.id); marcarSucio(); repintarPersonas();}
  else if(act==='prochoragregar'){
    const p=PIE[C.form.id]; const ini=document.getElementById('pe-ini').value, fin=document.getElementById('pe-fin').value;
    if(!ini||!fin||mins(ini)>=mins(fin)){aviso('Revise las horas.',3000);return;}
    const cs=[...document.getElementById('pe-cs').selectedOptions].map(o=>o.value);
    const t=document.getElementById('pe-t').value;
    p.horario=p.horario||[]; p.horario.push({d:document.getElementById('pe-d').value,ini,fin,t,cs,a:document.getElementById('pe-a').value.trim()||null,s:document.getElementById('pe-s').value.trim()||null});
    rederivarPro(p.id); marcarSucio(); repintarPersonas(); aviso('Atención agregada');
  }
  else if(act==='dclasequitar'){
    const [cid,d,ini,fin]=a.dataset.k.split('|'), id=C.form.id;
    (D.cursos[cid]?D.cursos[cid].blocks:[]).forEach(b=>{ if(b.c[d]&&!b.c[d].el&&mins(b.ini)>=mins(ini)&&mins(b.fin)<=mins(fin)) b.c[d].d=(b.c[d].d||[]).filter(x=>x!==id); });
    marcarSucio(); repintarPersonas(); aviso('Clase quitada');
  }
  else if(act==='dclaseagregar'){
    const id=C.form.id, cid=document.getElementById('dc-c').value, d=document.getElementById('dc-d').value, ini=document.getElementById('dc-ini').value, fin=document.getElementById('dc-fin').value, asig=document.getElementById('dc-a').value.trim();
    if(!ini||!fin||mins(ini)>=mins(fin)){aviso('Revise las horas.',3000);return;}
    const bl=(D.cursos[cid]?D.cursos[cid].blocks:[]).filter(b=>Math.min(mins(b.fin),mins(fin))-Math.max(mins(b.ini),mins(ini))>=20);
    if(!bl.length){aviso('Ese curso no tiene bloques en ese horario.',3500);return;}
    let n=0, falta=false;
    bl.forEach(b=>{ const e=b.c[d]; if(e){ if(e.el) return; e.d=e.d||[]; if(!e.d.includes(id)) e.d.push(id); n++; } else if(asig){ b.c[d]={a:asig,d:[id],p:[]}; n++; } else falta=true; });
    if(!n){aviso(falta?'Esos bloques están vacíos: escriba la asignatura.':'Esos bloques son de electivo: edítelos en Electivos.',4000);return;}
    marcarSucio(); repintarPersonas(); aviso('Clase agregada ('+n+(n===1?' bloque':' bloques')+')');
  }
  else if(act==='dhorquitar'){const p=DOC[C.form.id]; p.horario.splice(+a.dataset.i,1); marcarSucio(); repintarPersonas();}
  else if(act==='dhoragregar'){
    const p=DOC[C.form.id], ini=document.getElementById('do-ini').value, fin=document.getElementById('do-fin').value;
    if(!ini||!fin||mins(ini)>=mins(fin)){aviso('Revise las horas.',3000);return;}
    const o={d:document.getElementById('do-d').value,ini,fin,t:document.getElementById('do-t').value}, det=document.getElementById('do-det').value.trim(); if(det) o.det=det;
    p.horario=p.horario||[]; p.horario.push(o); marcarSucio(); repintarPersonas(); aviso('Actividad agregada');
  }
  else if(act==='egnuevo'){C.eg=nuevoGrupoForm();C.confirm=null;repintarGrupos();}
  else if(act==='egsel'){const g=GR[a.dataset.id]; if(g){C.eg=formDeGrupo(g);C.confirm=null;repintarGrupos();}}
  else if(act==='egcancel'){C.eg=null;repintarGrupos();}
  else if(act==='egquitd'){C.eg.d=C.eg.d.filter(x=>x!==a.dataset.id);repintarGrupos();}
  else if(act==='egquitp'){C.eg.p=C.eg.p.filter(x=>x.id!==a.dataset.id);C.eg.pTocado=true;repintarGrupos();}
  else if(act==='egaddslot'){C.eg.slots.push({d:'Lu',ini:'09:45',fin:'10:30'});repintarGrupos();}
  else if(act==='egquitslot'){C.eg.slots.splice(+a.dataset.i,1);repintarGrupos();}
  else if(act==='egconf'){C.confirm='egdel';repintarGrupos();}
  else if(act==='egnoconf'){C.confirm=null;repintarGrupos();}
  else if(act==='egdel'){
    const id=C.eg.id, g=GR[id];
    D.electivos=D.electivos.filter(x=>x.id!==id);
    marcarSucio(); C.eg=null; C.confirm=null; render(); aviso('Se quitó el electivo '+(g?g.nombre:''));
  }
  else if(act==='impmodo'){C.imp=Object.assign(nuevoImp(),{modo:a.dataset.v,texto:(C.imp&&C.imp.texto)||'',arch:(C.imp&&C.imp.arch)||null,hoja:(C.imp&&C.imp.hoja)||0}); if(C.imp.arch){ const h=C.imp.arch.hojas; if(!tieneDias(h[C.imp.hoja].grid)){ const i=h.findIndex(x=>tieneDias(x.grid)); if(i>=0) C.imp.hoja=i; } leerImportado(); } render();}
  else if(act==='impleer'){leerImportado(); render(); const p=document.querySelector('.preview'); if(p) p.scrollIntoView({block:'center'});}
  else if(act==='impborrar'){C.imp=Object.assign(nuevoImp(),{modo:C.imp.modo}); render();}
  else if(act==='impaplicar'){aplicarImportado();}
});
app.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){S.q=t.value; document.getElementById('items').innerHTML=itemsPersonas(S.tab);}
  else if(t.id==='cq'){C.q=t.value; document.getElementById('citems').innerHTML=itemsCfg();}
  else if(t.id==='pf-nombre'&&C.form){C.form.nombre=t.value;}
  else if(t.id==='pf-abrev'&&C.form){C.form.abrev=t.value;}
  else if(t.id==='pf-dept'&&C.form){C.form.dept=t.value;}
  else if(t.id==='pf-cargo'&&C.form){C.form.cargo=t.value;}
  else if(t.id==='eg-nombre'&&C.eg){C.eg.nombre=t.value;}
  else if(t.id==='imp-texto'&&C.imp){C.imp.texto=t.value;}
  else if(t.dataset&&t.dataset.act==='impelnombre'&&C.imp){C.imp.el[t.dataset.k].nombre=t.value;}
  else if(t.id==='cfsala'){D.cursos[C.curso].sala=t.value.trim()||null;marcarSucio();refrescarSavebar();}
});
app.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='fc'){S.ciclo=t.value; document.getElementById('items').innerHTML=itemsPersonas(S.tab);}
  else if(t.id==='fd'||t.id==='fh'){
    if(t.id==='fd'){S.desde=t.value||S.desde; if(!S.hasta||S.hasta<S.desde) S.hasta=S.desde; document.getElementById('fh').value=S.hasta;}
    else{S.hasta=t.value||S.desde; if(S.hasta<S.desde){S.desde=S.hasta; document.getElementById('fd').value=S.desde;}}
    S.off.clear(); actualizarHash(); refrescarResultados();
  }
  else if(t.dataset&&t.dataset.act==='inc'){
    if(t.checked) S.off.delete(t.dataset.k); else S.off.add(t.dataset.k);
    refrescarResultados();
  }
  else if(t.id==='cfcurso'){C.curso=t.value;render();}
  else if(t.id==='cfjefe'){D.cursos[C.curso].jefe=t.value||null;marcarSucio();render();}
  else if(t.dataset&&t.dataset.act==='hora'){
    const b=D.cursos[C.curso].blocks[+t.dataset.b]; if(!t.value) {t.value=b[t.dataset.k];return;}
    b[t.dataset.k]=t.value; marcarSucio(); render();
    const det=document.querySelector('details.det'); if(det) det.open=true;
  }
  else if(t.id==='eg-e'&&C.eg){C.eg.e=+t.value;}
  else if(t.id==='eg-addd'&&t.value){C.eg.d.push(t.value);repintarGrupos();}
  else if(t.id==='eg-addp'&&t.value){C.eg.p.push({id:t.value,ar:false});C.eg.pTocado=true;repintarGrupos();}
  else if(t.dataset&&t.dataset.act==='egcurso'){const id=t.dataset.id; C.eg.cursos=t.checked?uniq(C.eg.cursos.concat(id)):C.eg.cursos.filter(x=>x!==id);}
  else if(t.dataset&&t.dataset.act==='egar'){const p=C.eg.p.find(x=>x.id===t.dataset.id); if(p){p.ar=t.checked;C.eg.pTocado=true;}}
  else if(t.dataset&&t.dataset.act==='egslot'){const s=C.eg.slots[+t.dataset.i]; if(s) s[t.dataset.k]=t.value;}
  else if(t.id==='imp-file'&&C.imp){ if(t.files&&t.files[0]) cargarArchivo(t.files[0]); }
  else if(t.id==='imp-hoja'&&C.imp){C.imp.hoja=+t.value; C.imp.pidx=0; leerImportado(); render();}
  else if(t.id==='imp-panel'&&C.imp){C.imp.pidx=+t.value; leerImportado(); render();}
  else if(t.id==='imp-cid'&&C.imp){C.imp.cid=t.value;}
  else if(t.id==='imp-pid'&&C.imp){C.imp.pid=t.value;}
  else if(t.dataset&&t.dataset.act==='impmapa'){C.imp.map[t.dataset.t]=t.value;}
  else if(t.dataset&&t.dataset.act==='impel'){C.imp.el[t.dataset.k].acc=t.value; render();}
  else if(t.dataset&&t.dataset.act==='impelcurso'){const d=C.imp.el[t.dataset.k]; d.cursos=t.checked?uniq((d.cursos||[]).concat(t.dataset.id)):(d.cursos||[]).filter(x=>x!==t.dataset.id); render();}
  else if(t.dataset&&t.dataset.act==='impopt'){C.imp.opts[t.dataset.k]=t.checked; render();}
});
app.addEventListener('submit',e=>{
  const f=e.target.closest('form'); if(!f) return; e.preventDefault();
  if(f.dataset.form==='persona'){
    if(aplicarPersona()){ C.confirm=null; render(); aviso('Cambios aplicados'); } else repintarPersonas();
  }else if(f.dataset.form==='grupo'){
    if(aplicarGrupo()){ C.confirm=null; render(); aviso('Electivo actualizado'); } else repintarGrupos();
  }else if(f.dataset.form==='entrar'){ entrar(document.getElementById('clave').value); }
});
function refrescarSavebar(){ if(!document.querySelector('.savebar')) app.insertAdjacentHTML('beforeend',savebar()); }
function refrescarResultados(){const r=document.getElementById('resultados'); if(r) r.innerHTML=resultadosPermiso();}
async function entrar(clave){
  S.guardando=true; S.authErr=''; render();
  try{
    const j=await api({accion:'verificar',clave});
    if(j.ok){ S.auth={ok:true,clave}; guardaSS('hclave',clave); }
    else if(j.error==='clave') S.authErr='La clave no es correcta.';
    else S.authErr=(j.mensaje||('El servidor respondió con un error ('+(j.error||'desconocido')+').'));
  }catch(err){ S.authErr='No se pudo conectar con el servidor.'; }
  S.guardando=false; render();
}
async function recargar(){
  S.cargando=true; render();
  try{ await cargarServidor(); S.errCarga=''; C.form=null; C.eg=null; C.msg='Datos recargados.'; }catch(err){ S.errCarga='No se pudo conectar con el servidor.'; }
  S.cargando=false; render();
}
async function resetear(){
  C.confirm=null;
  if(API_URL){
    try{
      const j=await api({accion:'restablecer',clave:S.auth.clave});
      if(!j.ok){ aviso('No se pudo restablecer: '+(j.mensaje||j.error||'error'),5000); render(); return; }
      S.version=j.version||0;
    }catch(err){ aviso('No se pudo conectar con el servidor.',5000); render(); return; }
  }
  D=clonar(BASE); construir(); SNAP=JSON.stringify(D); S.dirty=false; C.form=null; C.eg=null; C.curso=null;
  C.msg='Se restauraron los datos originales.'; render(); aviso('Datos originales restaurados');
}
function copiar(txt){
  const ok=()=>aviso('Resumen copiado');
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(ok,()=>fallback());}
  else fallback();
  function fallback(){const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok();}catch(_){aviso('No se pudo copiar');}ta.remove();}
}
function aviso(m,ms){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(aviso.t);aviso.t=setTimeout(()=>t.hidden=true,ms||2200);}
window.addEventListener('hashchange',render);
window.addEventListener('beforeunload',e=>{ if(S.dirty){ e.preventDefault(); e.returnValue=''; } });

/* ---------- instalación como aplicación ---------- */
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}

/* ---------- arranque ---------- */
(async function(){
  const c=leeSS('hclave');
  if(API_URL&&c) S.auth={ok:true,clave:c};
  if(API_URL){
    S.cargando=true; render();
    try{ await Promise.race([cargarServidor(),new Promise((_,rej)=>setTimeout(()=>rej(new Error('tiempo')),12000))]); }
    catch(err){ S.errCarga='No se pudo conectar con el servidor: se muestran los datos base de data.js.'; }
    S.cargando=false;
  }
  render();
})();
})();
